<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>How the clock gets from the MTA's feed to the pixels</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="880" height="340" rx="14" fill="#ffffff"/>

  <!-- the MTA -->
  <rect x="24" y="40" width="150" height="96" rx="10" fill="#fff4e5" stroke="#eb6800" stroke-width="1.5"/>
  <text x="99" y="68" text-anchor="middle" font-weight="600" fill="#1f2328">MTA</text>
  <text x="99" y="90" text-anchor="middle" fill="#57606a" font-size="12.5">GTFS-Realtime feeds</text>
  <text x="99" y="108" text-anchor="middle" fill="#57606a" font-size="12.5">8 subway + alerts</text>
  <text x="99" y="126" text-anchor="middle" fill="#57606a" font-size="12.5">gzip, protobuf</text>

  <!-- the clock -->
  <rect x="204" y="20" width="652" height="300" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="222" y="44" font-weight="600" fill="#1f2328">Ulanzi TC001 · ESP32 · AWTRIX NG</text>

  <text x="222" y="76" fill="#57606a" font-size="12.5">core 0 · fetch task</text>
  <g>
    <rect x="222" y="86" width="100" height="56" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="272" y="110" text-anchor="middle" fill="#1f2328">TLS</text>
    <text x="272" y="128" text-anchor="middle" fill="#57606a" font-size="11.5">pinned roots</text>

    <rect x="346" y="86" width="110" height="56" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="401" y="110" text-anchor="middle" fill="#1f2328">gunzip</text>
    <text x="401" y="128" text-anchor="middle" fill="#57606a" font-size="11.5">ROM inflater</text>

    <rect x="480" y="86" width="150" height="56" rx="8" fill="#ffffff" stroke="#0062cf" stroke-width="1.5"/>
    <text x="555" y="110" text-anchor="middle" fill="#1f2328">GTFS-RT decoder</text>
    <text x="555" y="128" text-anchor="middle" fill="#57606a" font-size="11.5">&lt; 640 bytes of state</text>

    <rect x="654" y="86" width="180" height="56" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="744" y="110" text-anchor="middle" fill="#1f2328">snapshot</text>
    <text x="744" y="128" text-anchor="middle" fill="#57606a" font-size="11.5">arrival times · alert bits</text>
  </g>

  <text x="222" y="212" fill="#57606a" font-size="12.5">core 1 · render loop, every frame</text>
  <g>
    <rect x="222" y="222" width="150" height="56" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="297" y="246" text-anchor="middle" fill="#1f2328">Subway app</text>
    <text x="297" y="264" text-anchor="middle" fill="#57606a" font-size="11.5">Berry script, settings</text>

    <rect x="396" y="222" width="170" height="56" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="481" y="246" text-anchor="middle" fill="#1f2328">arrival rules</text>
    <text x="481" y="264" text-anchor="middle" fill="#57606a" font-size="11.5">minutes from the clock</text>

    <rect x="590" y="222" width="244" height="56" rx="8" fill="#1f2328"/>
    <text x="712" y="246" text-anchor="middle" fill="#ffffff">32 × 8 LEDs</text>
    <text x="712" y="264" text-anchor="middle" font-size="11.5"><tspan fill="#ff8a2b">3</tspan><tspan fill="#9aa4ae">  ·  </tspan><tspan fill="#4c9dff">7</tspan><tspan fill="#9aa4ae">  ·  </tspan><tspan fill="#4c9dff">12</tspan><tspan fill="#9aa4ae">  ·  </tspan><tspan fill="#ff8a2b">25</tspan></text>
  </g>

  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M174 114 H220"/>
    <path d="M322 114 H344"/>
    <path d="M456 114 H478"/>
    <path d="M630 114 H652"/>
    <path d="M744 142 V180 H481 V220"/>
    <path d="M372 250 H394"/>
    <path d="M566 250 H588"/>
  </g>
  <text x="560" y="174" text-anchor="middle" fill="#57606a" font-size="11.5">copied under a spinlock</text>
  <text x="196" y="106" text-anchor="middle" fill="#57606a" font-size="11.5">HTTPS</text>
</svg>
